name: Update IP data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh bundled region data
        run: python tools/prepare_data.py --refresh-index --force
      - name: Refresh bundled ASN data
        run: |
          mkdir -p data/asn
          while IFS=$'\t' read -r raw_asn _provider _description; do
            [[ "${raw_asn}" =~ ^AS[0-9]+$ ]] || continue
            asn="${raw_asn#AS}"
            curl -fsSL --connect-timeout 20 --retry 2 --retry-delay 1 \
              "https://raw.githubusercontent.com/ipverse/as-ip-blocks/master/as/${asn}/ipv4-aggregated.txt" \
              -o "data/asn/${raw_asn}.txt"
          done < data/asn/presets.tsv
      - name: Refresh three-carrier home broadband data
        run: bash tools/prepare_home_broadband_data.sh
      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          bash -n install.sh tools/ui_lib.sh tools/firewall_lib.sh tools/prepare_home_broadband_data.sh
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cncity.md data/regions.json data/regions.tsv data/regions data/country data/asn data/carriers
          git commit -m "Update bundled IP data"
          git push
